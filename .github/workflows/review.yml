# Coral reviewing Coral. What a repository installs is `examples/coral.yml`; this file differs
# from it in one line, calling the workflow beside it rather than a pinned reference.

name: Coral

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: coral-${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
  cancel-in-progress: false

jobs:
  coral:
    if: >-
      github.event_name != 'pull_request_target'
      || github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # A relative reference resolves with this default-branch caller. `pull_request_target` and the
    # comment paths all read it from there, so a branch cannot change how its own review runs.
    uses: ./.github/workflows/coral.yml
    secrets:
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
