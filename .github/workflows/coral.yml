name: Coral

on:
  workflow_call:
    # Every default lives here and nowhere else, so an install naming none of them reviews as it
    # always has. Nothing validates the model or the effort ahead of the review job: a value the
    # provider refuses arrives as the provider's own words in the failure comment.
    inputs:
      model:
        description: >
          The OpenRouter model id, named exactly as https://openrouter.ai/models has it. A `~`
          alias is refused, because it would resolve to whichever model is current.
        type: string
        required: false
        default: openai/gpt-5.6-luna
      reasoning_effort:
        description: >
          The effort passed to the provider in OpenRouter's reasoning block. Empty sends no block
          at all, which leaves the provider applying its own default.
        type: string
        required: false
        default: ""
      time_budget_minutes:
        description: >
          How long the review step gets. The review job's own `timeout-minutes` is this plus the
          headroom `coral/deadline.py` explains, and that sum is bounded by GitHub's ceiling on a
          job.
        type: number
        required: false
        default: 20
      spend_cap_dollars:
        description: >
          What one review may spend. It caps a minted key at mint time and stops a review whose own
          accounting reaches it, so it holds in both key modes. Two orders of magnitude above the
          most expensive review measured: the account's `Coral` key spent $0.063 across every live
          check up to 2026-08-07, so no single review has yet cost a cent. Low enough that a leaked
          key is not worth extracting; re-measure before raising it.
        # A string rather than a number, because the expression engine renders a number back into
        # text on the way into a composite action's `env:` block and a cap of a fraction of a cent
        # is where that rendering is not worth trusting.
        type: string
        required: false
        default: "2.00"
    # Exactly one of the two, which `coral resolve` is what enforces: Actions cannot express
    # "one of these", and a run passed neither or both fails there with a comment saying so.
    secrets:
      openrouter_api_key:
        description: A plain OpenRouter API key, passed to the review job as it is.
        required: false
      openrouter_management_key:
        description: An OpenRouter management key. Coral mints one API key per run with it.
        required: false

# Three jobs so the agent runs in a job whose token writes nothing. Each job boundary is crossed
# by job outputs for the values YAML reads and by artifacts for everything else, and each job
# builds Coral's virtual environment again: a cache the review job could write would let a
# compromised agent put its own code in the jobs holding the write scopes.
jobs:
  resolve:
    runs-on: ubuntu-latest
    # A backstop on a job that makes a handful of API calls, each already bounded by `TIMEOUT`
    # in `coral/github/client.py`.
    timeout-minutes: 10
    # A filter rather than a grant. The token arrives with whatever the calling job was given,
    # and this narrows it. `issues: write` and `pull-requests: write` are both needed because
    # the two reaction namespaces do not grant each other.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # Coarse by necessity: Actions expressions have no regular expressions and no way to work
    # line by line, so whether `/coral` really stands alone on its own line is decided in the
    # resolve step, and so is whether its author may ask — `author_association` names people
    # with read-only access as `MEMBER` and `COLLABORATOR`. What this does is keep runners from
    # being allocated for a delivery that is certainly not a trigger.
    # Every line of this expression sits at one indentation. A line indented deeper than the
    # first is "more indented" in a YAML folded scalar, which keeps its line break instead of
    # folding it to a space.
    if: >-
      (github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.user.type != 'Bot')
      || (github.event_name == 'issue_comment'
      && github.event.issue.pull_request != null
      && contains(github.event.comment.body, '/coral')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review_comment'
      && contains(github.event.comment.body, '/coral')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      minted-key: ${{ steps.resolve.outputs.minted-key }}
      timeout-minutes: ${{ steps.resolve.outputs.timeout-minutes }}
    steps:
      - id: setup
        uses: $/actions/setup

      - id: resolve
        uses: $/actions/resolve
        with:
          coral-bin: ${{ steps.setup.outputs.bin }}
          github-token: ${{ github.token }}
          # Validated here, before the fetch, so a budget the caller got wrong is loud on every
          # triggered run rather than only on the ones that reach a review.
          time-budget-minutes: ${{ inputs.time_budget_minutes }}
          # Validated here for the same reason, and the limit the minted key is created with.
          spend-cap-dollars: ${{ inputs.spend_cap_dollars }}
          openrouter-management-key: ${{ secrets.openrouter_management_key }}
          # Whether, never what. Resolve decides which mode this run is in and has no other use
          # for the plain key, so its value stays out of this job.
          openrouter-api-key-present: ${{ secrets.openrouter_api_key != '' }}

      # The files rather than their directory, so the artifact's root is the directory holding
      # them. `!cancelled()` so a failed job still hands on whatever it wrote; one day of
      # retention, because the artifact exists only to cross a job boundary inside this run.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coral-resolve
          path: |
            ${{ runner.temp }}/coral/pull-request.json
            ${{ runner.temp }}/coral/conversation.json
            ${{ runner.temp }}/coral/reason.txt
          retention-days: 1

  review:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # The budget plus the headroom `coral/deadline.py` explains, computed there because Actions
    # expressions have no arithmetic. `fromJSON` because this key takes a number and a job output
    # is a string.
    timeout-minutes: ${{ fromJSON(needs.resolve.outputs.timeout-minutes) }}
    # The job that runs the agent, and the point of the split: `contents: read` is what the
    # checkout needs and all this job holds. The review step makes no API call, so a compromised
    # agent finds no credential here that writes anything.
    permissions:
      contents: read
    steps:
      # First, so every later echo of the key is masked. The runner prints each step's `with:`
      # and `env:` block before running it, and a key the caller never set is registered nowhere,
      # so this step's own header carries it in the clear. That one line is what crossing a job
      # boundary costs; it is why the key is capped and expires. Skipped in pass-through mode,
      # where the caller's secret is registered and masked already.
      - if: needs.resolve.outputs.minted-key != ''
        env:
          MINTED_KEY: ${{ needs.resolve.outputs.minted-key }}
        run: echo "::add-mask::$MINTED_KEY"

      - id: setup
        uses: $/actions/setup

      # By `name`, so its absence fails this job loudly: a run that proceeded and cannot find
      # the pull request is broken.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coral-resolve
          path: ${{ runner.temp }}/coral

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The resolved SHA rather than the branch, which may have moved. Full history so the
          # merge base is exact and the base commit is present locally. No persisted credentials,
          # because the default writes the token into the repository's own git config.
          ref: ${{ needs.resolve.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: $/actions/review
        with:
          coral-bin: ${{ steps.setup.outputs.bin }}
          model: ${{ inputs.model }}
          reasoning-effort: ${{ inputs.reasoning_effort }}
          time-budget-minutes: ${{ inputs.time_budget_minutes }}
          spend-cap-dollars: ${{ inputs.spend_cap_dollars }}
          # Whichever mode the caller chose. Resolve has already refused a run that supplied both
          # or neither, so exactly one side of this is ever set.
          openrouter-api-key: ${{ secrets.openrouter_api_key || needs.resolve.outputs.minted-key }}

      # `!cancelled()` is what lets a failed review still hand its reason file on; a review that
      # died before writing anything uploads nothing, and that absence is an input the publishing
      # step reads.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coral-review
          path: |
            ${{ runner.temp }}/coral/review-payloads.json
            ${{ runner.temp }}/coral/reason.txt
          retention-days: 1

  publish:
    needs: [resolve, review]
    # Runs when a review was going to happen or when resolve broke before deciding, written
    # positively over resolve's own outcome. A decline already said whatever it owed, and a
    # delivery the coarse condition excluded leaves resolve `skipped`, which is neither value
    # named here. `!cancelled()` does two jobs: it keeps a cancelled run from posting anything,
    # and it is the status-check function without which Actions would imply `success()` and never
    # run this job after a failure.
    if: >-
      !cancelled()
      && ((needs.resolve.result == 'success' && needs.resolve.outputs.proceed == 'true')
      || needs.resolve.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - id: setup
        uses: $/actions/setup

      # Each by `pattern` in its own step: a job that died before writing anything created no
      # artifact, and `pattern` filters an empty list without error where `name` would fail the
      # job. The absence is an input `coral publish` reads.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coral-resolve
          merge-multiple: true
          path: ${{ runner.temp }}/coral

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coral-review
          merge-multiple: true
          path: ${{ runner.temp }}/coral

      - uses: $/actions/publish
        with:
          coral-bin: ${{ steps.setup.outputs.bin }}
          github-token: ${{ github.token }}
