# Copy this file into a repository as `.github/workflows/coral.yml` to install Coral.
#
# It carries the five things a reusable workflow cannot declare for its caller: the triggers,
# the token permissions, the concurrency group, the version pin, and the OpenRouter key. It is
# also where Coral is configured, and the only place: a file in the repository under review would
# let a pull request pick the model that reviews it.

name: Coral

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Declared here and never in the called workflow: a group shared between caller and called
# cancels the caller. A run already going finishes, and a newly queued run replaces whichever
# run was waiting, which is how several requests collapse into one.
concurrency:
  group: coral-${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
  cancel-in-progress: false

jobs:
  coral:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # A tag rather than `main`, so this repository runs the Coral you installed rather than
    # whatever lands on Coral's default branch afterwards. Bump it to take a newer Coral.
    uses: kkestell/coral/.github/workflows/coral.yml@v0.1.0
    # Coral's defaults, spelled out. Uncomment a line to change one; the whole block can go.
    # with:
    #   # Any OpenRouter model, named exactly as https://openrouter.ai/models has it. A `~` alias
    #   # is refused, so the model a review ran on is always knowable from this file.
    #   model: openai/gpt-5.6-luna
    #   # Passed to the provider in OpenRouter's reasoning block. Empty sends no block, leaving the
    #   # provider its own default; what a value may be is the provider's rule, not Coral's.
    #   reasoning_effort: ""
    #   # How long the review gets. The job's own timeout is ten minutes more than this.
    #   time_budget_minutes: 20
    #   # What one review may spend. A review that reaches this stops and says so, and a minted
    #   # key is created with this as its limit.
    #   spend_cap_dollars: "2.00"
    # Pass a plain API key, or both management-mode secrets. A management key gets each run its
    # own capped, expiring key, encrypted between the resolve and review jobs.
    secrets:
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      # openrouter_management_key: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
      # coral_key_encryption_key: ${{ secrets.CORAL_KEY_ENCRYPTION_KEY }}
