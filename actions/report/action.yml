name: Coral report
description: Say on the pull request that the run failed, unless the review step already did.

inputs:
  coral-bin:
    description: The directory holding the `coral` console script.
    required: true
  github-token:
    description: The job's token, scoped by the calling workflow's permissions block.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      # The inputs reach the shell as environment variables rather than being interpolated into
      # the script, so nothing in an input is ever parsed as shell.
      env:
        CORAL_BIN: ${{ inputs.coral-bin }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        "$CORAL_BIN/coral" report
