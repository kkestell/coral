name: Coral resolve
description: Decide whether there is a review to do, and pin the commit it is of.

inputs:
  coral-bin:
    description: The directory holding the `coral` console script.
    required: true
  github-token:
    description: The job's token, scoped by the calling workflow's permissions block.
    required: true
  openrouter-management-key:
    description: The management key Coral mints this run's API key with, or empty in the other mode.
    required: false
  coral-key-encryption-key:
    description: The Fernet key that encrypts this run's minted API key between jobs.
    required: false
  openrouter-api-key-present:
    description: Whether the caller passed a plain API key, as the string `true` or `false`.
    required: true
  time-budget-minutes:
    description: How long the review step gets, validated here and derived into the job's timeout.
    required: true
  spend-cap-dollars:
    description: What one review may spend, validated here and minted onto this run's key.
    required: true

outputs:
  proceed:
    description: Whether the run goes on. `false` is a decline rather than a failure.
    value: ${{ steps.resolve.outputs.proceed }}
  head-sha:
    description: The commit the review is of, and the commit the checkout takes.
    value: ${{ steps.resolve.outputs.head-sha }}
  timeout-minutes:
    description: The review job's `timeout-minutes` for the budget this run was given.
    value: ${{ steps.resolve.outputs.timeout-minutes }}
  encrypted-key:
    description: This run's Fernet-encrypted OpenRouter API key, or empty in plain-key mode.
    value: ${{ steps.resolve.outputs.encrypted-key }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      # The inputs reach the shell as environment variables rather than being interpolated into
      # the script, so nothing in an input is ever parsed as shell.
      env:
        CORAL_BIN: ${{ inputs.coral-bin }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENROUTER_MANAGEMENT_KEY: ${{ inputs.openrouter-management-key }}
        CORAL_KEY_ENCRYPTION_KEY: ${{ inputs.coral-key-encryption-key }}
        OPENROUTER_API_KEY_PRESENT: ${{ inputs.openrouter-api-key-present }}
        CORAL_TIME_BUDGET_MINUTES: ${{ inputs.time-budget-minutes }}
        CORAL_SPEND_CAP_DOLLARS: ${{ inputs.spend-cap-dollars }}
      run: |
        set -euo pipefail
        "$CORAL_BIN/coral" resolve
