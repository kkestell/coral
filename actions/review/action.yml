name: Coral review
description: Review the checked-out change and leave the result for the publishing job.

inputs:
  coral-bin:
    description: The directory holding the `coral` console script.
    required: true
  openrouter-api-key:
    description: The credential for the model provider.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      # The inputs reach the shell as environment variables rather than being interpolated into
      # the script, so nothing in an input is ever parsed as shell. No `github-token` input: the
      # review step makes no API call, and the step's environment holds no token to leak.
      env:
        CORAL_BIN: ${{ inputs.coral-bin }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
      run: |
        set -euo pipefail
        # A key the resolve job minted is no secret of the caller's, so the runner has registered
        # nothing for it. Unconditional: masking an already-masked secret is a no-op.
        echo "::add-mask::$OPENROUTER_API_KEY"
        "$CORAL_BIN/coral" review
