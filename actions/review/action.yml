name: Coral review
description: Review the checked-out change and leave the result for the publishing job.

inputs:
  coral-bin:
    description: The directory holding the `coral` console script.
    required: true
  openrouter-api-key:
    description: The caller's model-provider credential in plain-key mode.
    required: false
  encrypted-openrouter-api-key:
    description: The encrypted model-provider credential from resolve in management-key mode.
    required: false
  coral-key-encryption-key:
    description: The Fernet key that decrypts the management-mode credential.
    required: false
  model:
    description: The OpenRouter model id, named exactly.
    required: true
  reasoning-effort:
    description: The effort for OpenRouter's reasoning block, or empty to send no block.
    required: false
  time-budget-minutes:
    description: How long the review step gets, out of which the reviewer takes its own slice.
    required: true
  spend-cap-dollars:
    description: What one review may spend, across both agent runs.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      # The inputs reach the shell as environment variables rather than being interpolated into
      # the script, so nothing in an input is ever parsed as shell. No `github-token` input: the
      # review step makes no API call, and the step's environment holds no token to leak.
      env:
        CORAL_BIN: ${{ inputs.coral-bin }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        ENCRYPTED_OPENROUTER_API_KEY: ${{ inputs.encrypted-openrouter-api-key }}
        CORAL_KEY_ENCRYPTION_KEY: ${{ inputs.coral-key-encryption-key }}
        CORAL_MODEL: ${{ inputs.model }}
        CORAL_REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        CORAL_TIME_BUDGET_MINUTES: ${{ inputs.time-budget-minutes }}
        CORAL_SPEND_CAP_DOLLARS: ${{ inputs.spend-cap-dollars }}
      run: |
        set -euo pipefail
        "$CORAL_BIN/coral" review
