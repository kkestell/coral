name: Coral review
description: Review the checked-out change and post the result to the pull request.

inputs:
  coral-bin:
    description: The directory holding the `coral` console script.
    required: true
  github-token:
    description: The job's token, scoped by the calling workflow's permissions block.
    required: true
  openrouter-api-key:
    description: The credential for the model provider.
    required: false

runs:
  using: composite
  steps:
    - shell: bash
      # The inputs reach the shell as environment variables rather than being interpolated into
      # the script, so nothing in an input is ever parsed as shell.
      env:
        CORAL_BIN: ${{ inputs.coral-bin }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
      run: |
        set -euo pipefail
        "$CORAL_BIN/coral" review
