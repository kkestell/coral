[project]
name = "coral"
version = "0.1.0"
description = "A code review agent that runs as a GitHub Actions workflow"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.5",
    "httpx>=0.28.1",
    "langchain-openrouter>=0.2.7",
    "pydantic>=2.12.5",
]

[project.scripts]
coral = "coral.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coral"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
# Ruff formats Python inside Markdown fences, and the documents under `.agents/` are prose whose
# examples are written for a reader rather than for the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["coral", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
